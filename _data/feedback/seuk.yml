      - 에이전트에 파일 넣어 접수 (도구 신설 필요)

      D. 화면·앱·학습 (4항목)
      - 평가 현황판 정확한 내용 정하기 (대시보드와 역할 갈라 정리)
      - 대시보드 깔끔하게 (진행 중 것만 · 이미 정리)
      - 앱 최적화 (다른 기기 실측 · Play Store 서명 · 배터리 실측)
      - 파인튜닝 방법 (표정 ViT · Qwen3-8B QLoRA · 이미 두 건 수행)

