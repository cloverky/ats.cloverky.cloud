      - 면접 중 추가 질문 (사전 생성 됨 · 즉석 후속 질문은 후보)
      - 질문 음성 재생 (TTS · 결정 필요 · 마이크 오염 함정)
      - 면접 시간 상한 (전역 기본값 · 결정 필요)
      - 지원자 질문 창구 (없이 · 마무리 안내만 · 결정 됨)
      - "이상입니다" 종료 발화 인식 (버튼이 해결 · 우선순위 낮음)
      - 면접 관련 확장 방법 (답변 기반 즉석 후속 질문 후보)

      C. 지원자 쪽 (4항목)
      - 지원서 업로드 때 로그인 정보 (이메일 + 생년월일 · 동작)
      - 채용 공고 지원 방법 · 지원 페이지 (동작 · 실링크 시연)
